<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring segments -->
  <g transform="translate(60,60)">
    <!-- Top (North) - Pagoda -->
    <path d="M 0,-45 A 20,20 0 0,1 14,-42 L 14,-38 L 0,-35 Z" fill="#d97706" stroke="#78350f" stroke-width="1"/>
    <path d="M 0,-38 L 0,-28 L 8,-30 L 0,-32 Z" fill="#fbbf24" stroke="#78350f" stroke-width="0.5"/>
    
    <!-- Top-Right - Tribal Mask -->
    <path d="M 32,-32 A 20,20 0 0,1 42,-20 L 38,-18 L 28,-28 Z" fill="#0891b2" stroke="#164e63" stroke-width="1"/>
    <circle cx="33" cy="-25" r="2" fill="#164e63"/>
    <circle cx="37" cy="-22" r="2" fill="#164e63"/>
    
    <!-- Right (East) - River/Boat -->
    <path d="M 45,-14 A 20,20 0 0,1 45,14 L 42,14 L 42,-14 Z" fill="#06b6d4" stroke="#164e63" stroke-width="1"/>
    <path d="M 42,0 L 42,8 L 38,4 L 42,2 Z" fill="#164e63"/>
    
    <!-- Bottom-Right - Hut -->
    <path d="M 32,32 A 20,20 0 0,1 18,42 L 20,38 L 28,28 Z" fill="#92400e" stroke="#78350f" stroke-width="1"/>
    <path d="M 25,32 L 25,38 L 28,36 L 25,34 Z" fill="#fbbf24" stroke="#78350f" stroke-width="0.5"/>
    
    <!-- Bottom (South) - Arch -->
    <path d="M 0,45 A 20,20 0 0,1 -14,42 L -14,38 L 0,35 Z" fill="#7c2d12" stroke="#78350f" stroke-width="1"/>
    <path d="M -8,38 L -8,45 L 8,45 L 8,38 Z" fill="#fbbf24" stroke="#78350f" stroke-width="0.5"/>
    
    <!-- Bottom-Left - House -->
    <path d="M -32,32 A 20,20 0 0,1 -42,18 L -38,20 L -28,28 Z" fill="#b45309" stroke="#78350f" stroke-width="1"/>
    <path d="M -32,28 L -32,32 L -28,30 L -30,28 Z" fill="#fbbf24" stroke="#78350f" stroke-width="0.5"/>
    
    <!-- Left (West) - Drum -->
    <path d="M -45,-14 A 20,20 0 0,1 -45,14 L -42,14 L -42,-14 Z" fill="#92400e" stroke="#78350f" stroke-width="1"/>
    <path d="M -42,-4 L -42,4 L -38,0 L -42,-2 Z" fill="#fbbf24" stroke="#78350f" stroke-width="0.5"/>
    
    <!-- Top-Left - Building -->
    <path d="M -32,-32 A 20,20 0 0,1 -18,-42 L -20,-38 L -28,-28 Z" fill="#0891b2" stroke="#164e63" stroke-width="1"/>
    <path d="M -25,-32 L -25,-28 L -22,-30 L -25,-31 Z" fill="#fbbf24" stroke="#164e63" stroke-width="0.5"/>
  </g>
  
  <!-- Connecting dots -->
  <circle cx="30" cy="0" r="2" fill="#64748b"/>
  <circle cx="0" cy="30" r="2" fill="#64748b"/>
  <circle cx="-30" cy="0" r="2" fill="#64748b"/>
  <circle cx="0" cy="-30" r="2" fill="#64748b"/>
  <circle cx="21" cy="21" r="2" fill="#f97316"/>
  <circle cx="-21" cy="21" r="2" fill="#f97316"/>
  <circle cx="-21" cy="-21" r="2" fill="#f97316"/>
  <circle cx="21" cy="-21" r="2" fill="#f97316"/>
  
  <!-- Inner foliage -->
  <g transform="translate(60,60)">
    <path d="M -8,-8 Q -5,-12 0,-8 Q 5,-12 8,-8 Q 5,-4 0,-8 Q -5,-4 -8,-8" fill="#64748b" opacity="0.6"/>
    <path d="M -6,-6 Q -3,-10 0,-6 Q 3,-10 6,-6 Q 3,-2 0,-6 Q -3,-2 -6,-6" fill="#84cc16" opacity="0.7"/>
  </g>
  
  <!-- Central compass rose -->
  <g transform="translate(60,60)">
    <circle cx="0" cy="0" r="15" fill="#fef3c7" stroke="#78350f" stroke-width="1.5"/>
    <!-- N -->
    <text x="0" y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#78350f">N</text>
    <path d="M 0,-12 L -3,-8 L 0,-10 L 3,-8 Z" fill="#78350f"/>
    <!-- E -->
    <text x="12" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#78350f">E</text>
    <path d="M 12,0 L 8,-3 L 10,0 L 8,3 Z" fill="#78350f"/>
    <!-- S -->
    <text x="0" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#78350f">S</text>
    <path d="M 0,12 L -3,8 L 0,10 L 3,8 Z" fill="#78350f"/>
    <!-- W -->
    <text x="-12" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#78350f">W</text>
    <path d="M -12,0 L -8,-3 L -10,0 L -8,3 Z" fill="#78350f"/>
  </g>
</svg>

